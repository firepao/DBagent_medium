services:
  agent-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: resources-agent:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8030}:8030"
    env_file:
      - .env
    environment:
      SQLITE_DB_PATH: /data/energy.sqlite3
      DDL_DIRECTORY: /data/ddl
      PLATFORM_DB_PATH: /app/runtime/platform.sqlite3
      AUDIT_LOG_PATH: /app/runtime/query_audit.jsonl
      STAGE_TIMING_LOG_PATH: /app/runtime/stage_timing.jsonl
      LLM_TRACE_LOG_PATH: /app/runtime/llm_trace.jsonl
    volumes:
      - agent-runtime:/app/runtime
      - "${ENERGY_DB_PATH:-../data/数据入库v_1.1_0722/query_ready_v2/zhangbei_energy_query_ready_v2.sqlite3}:/data/energy.sqlite3:ro"
      - "${ENERGY_DDL_PATH:-../data/数据入库v_1.1_0722/query_ready_v2/ddl}:/data/ddl:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  agent-runtime:
