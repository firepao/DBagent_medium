<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>能源数据智能查询</title>
  <link rel="stylesheet" href="/assets/app.css?v=agent-runtime-20260828">
  <link rel="stylesheet" href="/assets/timeline.css?v=agent-runtime-20260828">
  <link rel="stylesheet" href="/assets/platform.css?v=agent-runtime-20260828">
  <link rel="stylesheet" href="/assets/responsive.css?v=agent-runtime-20260828">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/app"><span class="brand-mark">能</span><div><strong>能源数据 Agent</strong><small>张家口市能源数据平台</small></div></a>
      <nav aria-label="平台导航"><a class="active" href="/app">查数工作台</a><a href="/rules">规则管理</a><a href="/evaluations">评测中心</a></nav>
      <div class="topbar-actions"><button id="clearConversation" type="button">新会话</button><div class="health"><span id="healthDot"></span><span id="healthText">正在检查服务</span></div></div>
    </header>
    <main>
      <section class="workspace" aria-label="智能查数对话">
        <section class="platform-strip" aria-label="平台状态">
          <div><span>业务数据库</span><strong id="databaseState">检查中</strong></div>
          <div><span>模型供应池</span><strong id="providerState">检查中</strong></div>
          <div><span>生效规则</span><strong id="ruleState">检查中</strong></div>
          <div><span>发布门禁</span><strong id="releaseState">检查中</strong></div>
        </section>
        <div id="conversation" class="conversation" aria-live="polite">
          <div class="welcome">
            <p class="eyebrow">数据助手</p>
            <h1>直接询问能源数据</h1>
            <p>查询结果来自受控数据库，并经过查询安全检查和结果审核。</p>
            <div class="suggestions">
              <button type="button" data-question="张北县已运行风电项目装机容量合计是多少？">张北县风电装机容量</button>
              <button type="button" data-question="全市新能源项目按类型分布情况如何？">新能源项目类型分布</button>
              <button type="button" data-question="各县区备案项目数量排名">备案项目县区排名</button>
            </div>
            <div id="recentQuestions" class="recent-questions" hidden><div><strong>本次会话最近问题</strong><button id="clearHistory" type="button">清除</button></div><div id="recentQuestionList"></div></div>
          </div>
        </div>
        <section class="details" aria-label="运行信息">
          <div class="details-head"><h2>本次运行</h2><div><button id="copyRequestId" type="button" disabled>复制编号</button><button id="cancelRun" type="button" disabled>停止</button><button id="resumeRun" type="button" hidden>继续</button><span id="runStatus" class="status idle">待查询</span></div></div>
          <div id="runDetails" class="empty-details">
            <div class="empty-icon">i</div>
            <p>提交问题后，这里会显示请求编号、数据范围、来源和限制。</p>
          </div>
        </section>
        <form id="queryForm" class="composer">
          <label for="question" class="sr-only">输入查询问题</label>
          <textarea id="question" maxlength="2000" rows="1" placeholder="例如：张北县已运行风电项目装机容量合计是多少？" required></textarea>
          <button id="sendButton" type="submit" aria-label="发送查询" title="发送查询">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.1 21 12 3.4 3.9l.1 6.3L16 12 3.5 13.8z"/></svg>
          </button>
        </form>
        <p class="notice">系统仅执行只读查询。结果请结合数据时间和业务口径使用。</p>
      </section>
    </main>
  </div>
  <script src="/assets/app.js?v=agent-runtime-20260828" defer></script>
</body>
</html>
