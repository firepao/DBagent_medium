name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated deployment fixture
        run: |
          mkdir -p .ci-data/ddl
          python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('.ci-data/energy.sqlite3')
          connection.execute('CREATE TABLE smoke (id INTEGER PRIMARY KEY)')
          connection.close()
          PY
      - name: Validate Compose configuration
        env:
          ENERGY_DB_PATH: ./.ci-data/energy.sqlite3
          ENERGY_DDL_PATH: ./.ci-data/ddl
          OPENAI_BASE_URL: https://example.invalid/v1
          OPENAI_API_KEY: ci-placeholder
          OPENAI_MODEL: ci-placeholder
        run: |
          cp .env.example .env
          python tools/validate_deployment_assets.py
          docker compose config --quiet
      - name: Build production image
        run: docker build --tag resources-agent:ci .
      - name: Scan image filesystem
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: resources-agent:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
